  - main [ref=e13]:
    - generic [ref=e14]:
      - generic [ref=e15]:
        - heading "API Documentation" [level=1] [ref=e16]
        - paragraph [ref=e17]: Send messages from your site or app and receive them in your inbox.
      - generic [ref=e18]:
        - heading "How it works" [level=2] [ref=e19]
        - paragraph [ref=e20]: Every message you send through the API is delivered as an email to the address you signed up with. That makes it a good fit for contact forms, feedback widgets and notifications from your own site — your visitors never need an account, and you never expose your inbox.
        - list [ref=e21]:
          - listitem [ref=e22]: Create a project on the Dashboard with a name and the domain you'll call the API from.
          - listitem [ref=e23]: Copy the API key generated for that project.
          - listitem [ref=e24]:
            - text: Send a
            - code [ref=e25]: POST
            - text: request to the endpoint below with the key included in the request body.
        - paragraph [ref=e26]: Each project has its own key and its own message counter, so you can use one project per site and track them separately on the Dashboard.
      - generic [ref=e27]:
        - heading "Authentication" [level=2] [ref=e28]
        - paragraph [ref=e29]:
          - text: Pass your project's API key as the
          - code [ref=e30]: api
          - text: field in the JSON body of every request. There is no authorization header — the key goes in the body.
        - paragraph [ref=e31]: "Keys are valid for one year from the moment the project is created. After that the API returns 401 and you'll need to create a new project to get a fresh key. Treat the key as a secret: anyone who has it can send messages to your inbox and consume your daily quota."
      - generic [ref=e32]:
        - heading "Send a message" [level=2] [ref=e33]
        - paragraph [ref=e34]:
          - generic [ref=e35]: POST http://localhost:3000/api/send-message
        - paragraph [ref=e36]: Body parameters
        - table [ref=e37]:
          - rowgroup [ref=e38]:
            - row [ref=e39]:
              - cell [ref=e40]:
                - code [ref=e41]: api
              - cell "string" [ref=e42]
              - cell "Your project's API key, copied from the Dashboard." [ref=e43]
            - row [ref=e44]:
              - cell [ref=e45]:
                - code [ref=e46]: from
              - cell "string" [ref=e47]
              - cell "Who the message is from — typically the email address or name your visitor entered in your form. It is shown at the top of the email body." [ref=e48]
            - row [ref=e49]:
              - cell [ref=e50]:
                - code [ref=e51]: subject
              - cell "string" [ref=e52]
              - cell "Subject line of the email you receive." [ref=e53]
            - row [ref=e54]:
              - cell [ref=e55]:
                - code [ref=e56]: message
              - cell "string" [ref=e57]
              - cell "The message body." [ref=e58]
        - paragraph [ref=e59]: cURL
        - code [ref=e61]: "curl -X POST http://localhost:3000/api/send-message \\ -H \"Content-Type: application/json\" \\ -d '{ \"api\": \"YOUR_API_KEY\", \"from\": \"visitor@example.com\", \"subject\": \"New contact form submission\", \"message\": \"Hi, I would like to know more about your pricing.\" }'"
        - paragraph [ref=e62]: JavaScript (fetch)
        - code [ref=e64]: "await fetch(\"http://localhost:3000/api/send-message\", { method: \"POST\", headers: { \"Content-Type\": \"application/json\" }, body: JSON.stringify({ api: import.meta.env.VITE_MESSAGE_API_KEY, from: form.email, subject: \"New contact form submission\", message: form.message, }), });"
        - paragraph [ref=e65]: Response
        - code [ref=e67]: "{ \"message\": \"Email sent successfully\" }"
      - generic [ref=e68]:
        - heading "Daily limits" [level=2] [ref=e69]
        - paragraph [ref=e70]: Each project can send 100 messages per day. The counter is per project, not per account, so two projects have 100 each.
        - list [ref=e71]:
          - listitem [ref=e72]: The daily counter resets at the start of each calendar day.
          - listitem [ref=e73]: Once the limit is reached, further requests are rejected with 429 until the reset — nothing is queued or sent late.
          - listitem [ref=e74]: A request counts against your quota as soon as it is accepted, including when delivery later fails.
          - listitem [ref=e75]: The Messages column on the Dashboard shows the all-time total for each project, not just today's.
        - paragraph [ref=e76]: If you expect more volume than this, spread traffic across projects or ask for the limit on your account to be raised.
      - generic [ref=e77]:
        - heading "Errors" [level=2] [ref=e78]
        - table [ref=e79]:
          - rowgroup [ref=e80]:
            - row [ref=e81]:
              - cell [ref=e82]:
                - code [ref=e83]: "401"
              - cell "Invalid Api Key" [ref=e84]
              - cell [ref=e85]:
                - text: The
                - code [ref=e86]: api
                - text: field is missing, malformed, or the key has expired.
            - row [ref=e87]:
              - cell [ref=e88]:
                - code [ref=e89]: "404"
              - cell "Project not found" [ref=e90]
              - cell "The key is valid but its project no longer exists — most likely it was deleted from the Dashboard." [ref=e91]
            - row [ref=e92]:
              - cell [ref=e93]:
                - code [ref=e94]: "429"
              - cell "Daily limit reached" [ref=e95]
              - cell "This project has already sent 100 messages today. Retry after the daily reset." [ref=e96]
            - row [ref=e97]:
              - cell [ref=e98]:
                - code [ref=e99]: "500"
              - cell "Failed to send email" [ref=e100]
              - cell "The message was accepted but could not be delivered. Safe to retry, though it will count against your quota again." [ref=e101]